<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Reto de lectura · 100 palabras</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--text:#1f2937;--muted:#667085;--accent:#685cf6;--line:#e7e9ee;--bad:#b23b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:12px 12px 28px}
header{text-align:center;margin:6px 0 12px}
h1{font-size:clamp(28px,6vw,44px);margin:0 0 4px}
.sub{color:var(--muted);font-size:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(20,25,35,.05)}
.player-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;background:#fff;color:var(--text)}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.metric{padding:10px 6px;border-radius:15px;background:#f3f4f8}
.metric b{display:block;font-size:clamp(30px,7vw,40px)}
.metric span{font-size:12px;color:var(--muted)}
.controls{display:grid;gap:9px;margin-top:12px}
button{border:0;border-radius:15px;padding:14px;font-size:18px;font-weight:800}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef0f5;color:var(--text)}
.danger{background:#feecec;color:var(--bad)}
.status{text-align:center;font-weight:700;margin-top:10px;min-height:22px;font-size:14px}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.word{display:flex;align-items:center;justify-content:center;min-height:46px;text-align:center;font-size:clamp(20px,4vw,29px);padding:6px 3px;border-radius:10px}
.page{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.result{display:none;text-align:center;background:#f5f6ff;border-radius:17px;padding:16px;margin-top:12px}
.result .big{font-size:58px;font-weight:900;color:var(--accent)}
.result h2{margin:0 0 6px}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.history{width:100%;border-collapse:collapse;margin-top:10px}
.history th,.history td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.history th{font-size:12px;color:var(--muted)}
.record{font-weight:900;color:var(--accent)}
@media(max-width:520px){
  .words{grid-template-columns:repeat(4,1fr)}
  .word{font-size:21px;min-height:44px}
  .player-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📚 Reto de lectura</h1>
  <div class="sub">100 palabras · 60 segundos</div>
</header>

<div class="panel">
  <div class="player-row">
    <select id="playerSelect"></select>
    <select id="levelSelect">
      <option value="easy">6–7 años · Fácil</option>
      <option value="medium">8–11 años · Intermedio</option>
      <option value="adult">12+ / Adulto · Avanzado</option>
    </select>
  </div>
  <div class="controls"><button class="secondary" id="addPlayer">➕ Añadir jugador</button></div>
  <div class="top">
    <div class="metric"><b id="time">60</b><span>segundos</span></div>
    <div class="metric"><b id="read">0</b><span>reconocidas</span></div>
    <div class="metric"><b id="left">100</b><span>por leer</span></div>
  </div>
  <div class="controls">
    <button class="primary" id="start">🎙️ Empezar</button>
    <button class="secondary" id="new">🔀 Nuevas palabras</button>
    <button class="danger" id="stop">⏹ Terminar</button>
  </div>
  <div class="status" id="status">Elige jugador y nivel. No se marcará ninguna palabra.</div>
  <div class="result" id="result">
    <h2 id="resultTitle">¡Prueba terminada!</h2>
    <div class="big" id="finalCount">0</div>
    <div>palabras reconocidas</div>
    <div class="note" id="resultText"></div>
  </div>
</div>

<div class="panel">
  <div class="words" id="words"></div>
  <div class="page" id="pageInfo"></div>
</div>

<div class="panel">
  <b>Corrección rápida</b>
  <div class="note">Solo si el micrófono falla con alguna palabra.</div>
  <div class="manual">
    <button class="secondary" id="plus">+1 palabra</button>
    <button class="secondary" id="minus">−1 palabra</button>
  </div>
</div>

<div class="panel">
  <b>🏆 Resultados</b>
  <div id="recordBox" class="note" style="margin-top:8px"></div>
  <div style="overflow:auto">
    <table class="history">
      <thead><tr><th>Jugador</th><th>Nivel</th><th>Fecha</th><th>Resultado</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>
</div>

gimnasio", "museo", "teatro", "cine", "barrio", "vecino", "policía", "bombero", "médica", "dentista", "cocinero", "jardinero", "maestro", "alumno", "compañero", "padre", "madre", "hijo", "hija", "tío", "tía", "nieto", "nieta", "abrazo", "beso", "sonrisa", "risa", "sueño", "miedo", "alegría", "calma", "paz", "amor", "cariño", "ayuda", "favor", "gracias", "perdón", "saludo", "llamada", "mensaje", "idea", "recuerdo", "broma", "reto", "premio", "copa", "punto", "marca", "equipo", "partido", "carrera", "paseo", "viaje", "maleta", "billete", "taxi", "autobús", "granja", "animal", "mascota", "tortuga", "loro", "canario", "toro", "cabra", "cerdo", "gallo", "cisne", "águila", "búho", "gorrión", "cebra", "panda", "ciervo", "ardilla", "erizo", "ratón", "delfín", "ballena", "tiburón", "pulpo", "cangrejo", "medusa", "sapo", "serpiente", "lagarto", "mariposa", "mosca", "mosquito", "araña", "mariquita", "caracol", "gusano", "pino", "olivo", "palmera", "roble", "semilla", "planta", "rama", "raíz", "tronco", "fruto", "calor", "sombra", "luz", "planeta", "espacio", "cero", "once", "doce", "trece", "catorce", "quince", "veinte", "treinta", "cuarenta", "cincuenta", "cien", "derecha", "izquierda", "principio", "final", "centro", "mitad"];
const MEDIUM_BANK = WORD_BANK.filter(w => w.length <= 10);
const LEVEL_LABELS = {easy:"6–7 años", medium:"8–11 años", adult:"12+ / Adulto"};

let challenge=[], active=false, recognition=null, seconds=60, timer=null, pageTimer=null;
let pageIndex=0, liveCount=0, committedCount=0, sessionWords=0;

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zñ0-9\s]/gi," ").replace(/\s+/g," ").trim();
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function makeChallenge(){
  const level=document.getElementById("levelSelect").value;
  const bank=level==="easy"?EASY_BANK:(level==="medium"?MEDIUM_BANK:WORD_BANK);
  const nNames=level==="easy"?8:10;
  challenge=shuffle([...shuffle(NAME_BANK).slice(0,nNames), ...shuffle(bank).slice(0,100-nNames)]);
  pageIndex=0;
  renderWords();
}
function updateCount(n){
  liveCount=Math.max(0,Math.min(100,n));
  document.getElementById("read").textContent=liveCount;
  document.getElementById("left").textContent=100-liveCount;
}
function renderWords(){
  const box=document.getElementById("words"); box.innerHTML="";
  const start=pageIndex*20;
  const end=Math.min(100,start+20);
  for(let i=start;i<end;i++){
    const d=document.createElement("div");
    d.className="word";
    d.textContent=challenge[i];
    box.appendChild(d);
  }
  document.getElementById("pageInfo").textContent=`Bloque ${pageIndex+1} de 5 · palabras ${start+1}-${end}`;
}
function getPlayers(){return JSON.parse(localStorage.getItem("readingPlayers")||'["Jugador 1"]')}
function savePlayers(p){localStorage.setItem("readingPlayers",JSON.stringify(p))}
function refreshPlayers(selected){
  const s=document.getElementById("playerSelect");s.innerHTML="";
  getPlayers().forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;s.appendChild(o)});
  if(selected)s.value=selected;
}
function getHistory(){return JSON.parse(localStorage.getItem("readingHistory")||"[]")}
function saveHistory(h){localStorage.setItem("readingHistory",JSON.stringify(h))}
function renderHistory(){
  const h=getHistory(),body=document.getElementById("historyBody");body.innerHTML="";
  h.slice().reverse().slice(0,30).forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.player}</td><td>${r.level||"-"}</td><td>${r.date}</td><td><b>${r.score}</b></td>`;
    body.appendChild(tr);
  });
  const p=document.getElementById("playerSelect").value;
  const lvl=LEVEL_LABELS[document.getElementById("levelSelect").value];
  const scores=h.filter(r=>r.player===p && (!r.level || r.level===lvl)).map(r=>r.score);
  document.getElementById("recordBox").innerHTML=scores.length
    ? `Récord de <b>${p}</b> en ${lvl}: <span class="record">${Math.max(...scores)} palabras</span>`
    : `Todavía no hay resultados para <b>${p}</b> en ${lvl}.`;
}
function stopRecognition(){
  if(recognition){
    try{recognition.onend=null;recognition.stop()}catch(e){}
    recognition=null;
  }
}
function reset(){
  stopRecognition();clearInterval(timer);clearInterval(pageTimer);
  active=false;seconds=60;liveCount=0;committedCount=0;sessionWords=0;pageIndex=0;
  makeChallenge();
  document.getElementById("time").textContent="60";
  document.getElementById("result").style.display="none";
  document.getElementById("status").textContent="Elige jugador y nivel. No se marcará ninguna palabra.";
  document.getElementById("start").textContent="🎙️ Empezar";
  updateCount(0);
}
function countWords(text){
  const t=norm(text); return t? t.split(/\s+/).filter(Boolean).length:0;
}
function beginRecognitionSession(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById("status").textContent="Este navegador no ofrece reconocimiento de voz.";
    return;
  }
  recognition=new SR();
  recognition.lang="es-ES";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  sessionWords=0;

  recognition.onresult=(e)=>{
    // Recalcula toda la sesión actual, incluyendo resultado provisional.
    // Así el movimiento es rápido incluso antes de que la niña haga una pausa para respirar.
    let text="";
    for(let i=0;i<e.results.length;i++) text+=" "+e.results[i][0].transcript;
    sessionWords=countWords(text);
    updateCount(committedCount+sessionWords);
    document.getElementById("status").textContent="🎙️ Escuchando… lee seguido. La pantalla cambia sola.";
  };

  recognition.onend=()=>{
    if(!active)return;
    committedCount=Math.min(100,committedCount+sessionWords);
    sessionWords=0;
    updateCount(committedCount);
    setTimeout(()=>{if(active)beginRecognitionSession()},120);
  };

  recognition.onerror=(e)=>{
    if(active)document.getElementById("status").textContent="Micrófono: "+e.error+". Sigue leyendo.";
  };

  try{recognition.start()}catch(e){}
}
function start(){
  if(active)return;
  active=true;seconds=60;liveCount=0;committedCount=0;sessionWords=0;pageIndex=0;
  document.getElementById("result").style.display="none";
  document.getElementById("start").textContent="🎙️ Leyendo…";
  makeChallenge();
  updateCount(0);
  beginRecognitionSession();
  clearInterval(timer);
  timer=setInterval(()=>{
    seconds--;document.getElementById("time").textContent=seconds;
    if(seconds<=0)finish();
  },1000);
  pageTimer=setInterval(()=>{ if(active && pageIndex<4){ pageIndex++; renderWords(); } },12000);
}
function finish(){
  if(!active){
    document.getElementById("status").textContent="La prueba todavía no ha empezado.";
    return;
  }
  const finalScore=Math.max(liveCount,Math.min(100,committedCount+sessionWords));
  active=false;clearInterval(timer);clearInterval(pageTimer);stopRecognition();updateCount(finalScore);
  const player=document.getElementById("playerSelect").value;
  const level=LEVEL_LABELS[document.getElementById("levelSelect").value];
  const now=new Date();
  const date=now.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+
             now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  const h=getHistory();h.push({player,level,date,score:finalScore});saveHistory(h);
  document.getElementById("resultTitle").textContent=`¡Muy bien, ${player}!`;
  document.getElementById("finalCount").textContent=finalScore;
  document.getElementById("resultText").textContent=`Nivel: ${level} · ` + (
    finalScore>=100?"¡Reto de 100 completado!":finalScore>=80?"¡Muy buen ritmo!":
    finalScore>=60?"¡Buen trabajo!":"¡A por el siguiente intento!");
  document.getElementById("result").style.display="block";
  document.getElementById("status").textContent="Prueba terminada.";
  document.getElementById("start").textContent="🎙️ Empezar";
  renderHistory();
}
document.getElementById("start").onclick=start;
document.getElementById("stop").onclick=finish;
document.getElementById("new").onclick=reset;
document.getElementById("plus").onclick=()=>{if(active){committedCount++;sessionWords=0;updateCount(committedCount)}};
document.getElementById("minus").onclick=()=>{if(active){committedCount=Math.max(0,committedCount-1);sessionWords=0;updateCount(committedCount)}};
document.getElementById("addPlayer").onclick=()=>{
  const name=prompt("Nombre del jugador:");
  if(!name||!name.trim())return;
  const clean=name.trim(),p=getPlayers();
  if(!p.includes(clean)){p.push(clean);savePlayers(p)}
  refreshPlayers(clean);renderHistory();
};
document.getElementById("playerSelect").onchange=renderHistory;
document.getElementById("levelSelect").onchange=reset;

refreshPlayers();reset();renderHistory();
</script>
