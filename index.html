<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Reto de lectura · 100 palabras</title>
<style>
:root{
  --bg:#f7f8fb; --card:#fff; --text:#1f2937; --muted:#667085;
  --accent:#685cf6; --line:#e7e9ee; --ok:#187453; --bad:#b23b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:12px 12px 28px}
header{text-align:center;margin:6px 0 12px}
h1{font-size:clamp(28px,6vw,44px);margin:0 0 4px}
.sub{color:var(--muted);font-size:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(20,25,35,.05)}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.metric{padding:10px 6px;border-radius:15px;background:#f3f4f8}
.metric b{display:block;font-size:clamp(30px,7vw,40px)}
.metric span{font-size:12px;color:var(--muted)}
.controls{display:grid;gap:9px;margin-top:12px}
button{border:0;border-radius:15px;padding:14px;font-size:18px;font-weight:800}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef0f5;color:var(--text)}
.danger{background:#feecec;color:var(--bad)}
.status{text-align:center;font-weight:700;margin-top:10px;min-height:22px;font-size:14px}
.words{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 8px}
.word{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;font-size:clamp(20px,3.7vw,29px);padding:6px 3px;border-radius:10px}
.page{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.result{display:none;text-align:center;background:#f5f6ff;border-radius:17px;padding:16px;margin-top:12px}
.result .big{font-size:58px;font-weight:900;color:var(--accent)}
.result h2{margin:0 0 6px}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
@media(max-width:520px){
  .words{grid-template-columns:repeat(4,1fr)}
  .word{font-size:22px;min-height:45px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📚 Reto de lectura</h1>
  <div class="sub">100 palabras · 60 segundos</div>
</header>

<div class="panel">
  <div class="top">
    <div class="metric"><b id="time">60</b><span>segundos</span></div>
    <div class="metric"><b id="read">0</b><span>reconocidas</span></div>
    <div class="metric"><b id="left">100</b><span>por leer</span></div>
  </div>

  <div class="controls">
    <button class="primary" id="start">🎙️ Empezar</button>
    <button class="secondary" id="new">🔀 Nuevas palabras</button>
    <button class="danger" id="stop">⏹ Terminar</button>
  </div>
  <div class="status" id="status">Pulsa “Empezar”. Las palabras avanzarán solas.</div>

  <div class="result" id="result">
    <h2>¡Prueba terminada!</h2>
    <div class="big" id="finalCount">0</div>
    <div>palabras reconocidas</div>
    <div class="note" id="resultText"></div>
  </div>
</div>

<div class="panel">
  <div class="words" id="words"></div>
  <div class="page" id="pageInfo"></div>
</div>

<div class="panel">
  <b>Si el micrófono falla con alguna palabra</b>
  <div class="note">Puedes corregir el contador manualmente sin detener la prueba.</div>
  <div class="manual">
    <button class="secondary" id="plus">+1 palabra</button>
    <button class="secondary" id="minus">−1 palabra</button>
  </div>
</div>
</div>

<script>
const bank = `
casa mesa silla gato perro sol luna mar pan sal tren flor nube mano pie ojo boca pelo cama vaso plato libro hoja lápiz goma
niño niña mamá papá abuelo abuela amigo amiga escuela clase patio parque calle coche moto bici árbol campo río playa montaña
leche agua sopa arroz pasta queso huevo carne fruta pera manzana uva fresa limón naranja tomate patata panadero médico maestra
rojo azul verde blanco negro rosa gris grande pequeño alto bajo largo corto nuevo viejo bueno malo feliz triste fuerte suave
uno dos tres cuatro cinco seis siete ocho nueve diez lunes martes miércoles jueves viernes sábado domingo enero febrero marzo abril
mayo junio julio agosto septiembre octubre noviembre diciembre mañana tarde noche hoy ayer pronto lejos cerca dentro fuera arriba
abajo delante detrás izquierda derecha rápido lento mucho poco siempre nunca aquí allí ahora luego antes después primero último
correr saltar jugar leer escribir pintar cantar bailar mirar ver oír hablar decir contar sumar restar abrir cerrar subir bajar
comer beber dormir reír llorar andar nadar volar vivir querer tener hacer poner sacar entrar salir venir ir dar tomar coger dejar
bonito alegre limpio claro oscuro caliente frío dulce salado redondo cuadrado fácil difícil tranquilo ruido música cuento juego
pelota muñeca barco avión estrella cielo lluvia viento nieve fuego tierra bosque jardín puerta ventana tejado cocina salón baño
camisa pantalón vestido zapato calcetín abrigo gorro bufanda bolsillo botón mochila caja bolsa regalo fiesta tarta vela globo
conejo caballo vaca oveja gallina pato pájaro pez rana mariposa abeja hormiga león tigre elefante mono jirafa oso lobo zorro
hermano hermana primo prima familia bebé señor señora gente persona nombre número letra palabra frase pregunta respuesta verdad
tiempo hora minuto segundo reloj día semana mes año primavera verano otoño invierno desayuno comida merienda cena hambre sed
corazón cabeza brazo pierna dedo nariz oreja diente lengua espalda barriga rodilla cuello cara cuerpo salud
película foto dibujo color papel tijera pegamento regla cuaderno pizarra recreo deberes examen problema solución
mercado tienda dinero moneda euro compra precio cesta botella paquete kilo metro camino puente plaza ciudad pueblo
yogur galleta chocolate helado azúcar harina aceite tortilla bocadillo ensalada gazpacho pollo jamón cereal
arena ola piscina toalla bañador gafas cubo pala castillo concha puerto isla faro
`.trim().split(/\s+/);

const PAGE_SIZE = 25;
const PAGE_SECONDS = 15;

let words=[], pageIndex=0, seconds=60, timer=null, pageTimer=null;
let active=false, recognition=null, count=0;
let seenFinal = "";

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zñ0-9\s]/gi," ").replace(/\s+/g," ").trim();
}

function makeWords(){
  const unique=[...new Set(bank)];
  for(let i=unique.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [unique[i],unique[j]]=[unique[j],unique[i]];
  }
  words=unique.slice(0,100);
}

function renderPage(){
  const box=document.getElementById("words");
  box.innerHTML="";
  const start=pageIndex*PAGE_SIZE;
  const end=Math.min(start+PAGE_SIZE,100);
  words.slice(start,end).forEach(w=>{
    const d=document.createElement("div");
    d.className="word";
    d.textContent=w;
    box.appendChild(d);
  });
  document.getElementById("pageInfo").textContent=`Bloque ${pageIndex+1} de 4 · palabras ${start+1}-${end}`;
}

function reset(){
  stopRecognition();
  clearInterval(timer); clearInterval(pageTimer);
  active=false; seconds=60; count=0; pageIndex=0; seenFinal="";
  makeWords(); renderPage();
  document.getElementById("time").textContent="60";
  document.getElementById("read").textContent="0";
  document.getElementById("left").textContent="100";
  document.getElementById("result").style.display="none";
  document.getElementById("status").textContent="Pulsa “Empezar”. Las palabras avanzarán solas.";
  document.getElementById("start").textContent="🎙️ Empezar";
}

function updateCount(){
  count=Math.max(0,Math.min(100,count));
  document.getElementById("read").textContent=count;
  document.getElementById("left").textContent=100-count;
}

function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById("status").textContent="Este navegador no ofrece reconocimiento de voz.";
    return;
  }
  recognition=new SR();
  recognition.lang="es-ES";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  let lastInterimWords = 0;

  recognition.onresult=(e)=>{
    let finalText="";
    let interimText="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText+=" "+t;
      else interimText+=" "+t;
    }

    if(finalText.trim()){
      const n=norm(finalText).split(/\s+/).filter(Boolean).length;
      count += n;
      lastInterimWords=0;
      updateCount();
    } else if(interimText.trim()){
      // Muestra sensación de respuesta rápida sin comprometer el total.
      const n=norm(interimText).split(/\s+/).filter(Boolean).length;
      document.getElementById("status").textContent=`🎙️ Escuchando… ${n} palabra${n===1?"":"s"} en curso`;
      lastInterimWords=n;
    }
  };

  recognition.onend=()=>{
    if(active){
      setTimeout(()=>{try{recognition.start()}catch(e){}},150);
    }
  };

  recognition.onerror=(e)=>{
    if(active) document.getElementById("status").textContent="Micrófono: "+e.error;
  };

  try{
    recognition.start();
    document.getElementById("status").textContent="🎙️ Escuchando… lee seguido, sin esperar a que cambie la pantalla.";
  }catch(e){}
}

function stopRecognition(){
  if(recognition){
    try{recognition.onend=null; recognition.stop();}catch(e){}
    recognition=null;
  }
}

function start(){
  if(active) return;
  active=true; seconds=60; count=0; pageIndex=0; updateCount(); renderPage();
  document.getElementById("result").style.display="none";
  document.getElementById("start").textContent="🎙️ Leyendo…";
  startRecognition();

  clearInterval(timer);
  timer=setInterval(()=>{
    seconds--;
    document.getElementById("time").textContent=seconds;
    if(seconds<=0) finish();
  },1000);

  clearInterval(pageTimer);
  pageTimer=setInterval(()=>{
    if(!active) return;
    if(pageIndex<3){ pageIndex++; renderPage(); }
  }, PAGE_SECONDS*1000);
}

function finish(){
  if(!active){
    document.getElementById("status").textContent="La prueba todavía no ha empezado.";
    return;
  }
  active=false;
  clearInterval(timer); clearInterval(pageTimer); stopRecognition();
  document.getElementById("start").textContent="🎙️ Empezar";
  document.getElementById("status").textContent="Prueba terminada.";
  document.getElementById("finalCount").textContent=count;
  document.getElementById("resultText").textContent =
    count>=100 ? "¡100 palabras o más! Excelente." :
    count>=80 ? "¡Muy buen ritmo!" :
    count>=60 ? "¡Buen trabajo! Sigue practicando." :
    "Cada intento ayuda a mejorar.";
  document.getElementById("result").style.display="block";
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"center"});
}

document.getElementById("start").onclick=start;
document.getElementById("stop").onclick=finish;
document.getElementById("new").onclick=reset;
document.getElementById("plus").onclick=()=>{if(active){count++;updateCount()}};
document.getElementById("minus").onclick=()=>{if(active){count--;updateCount()}};

reset();
</script>
</body>
</html>
